services:
  - type: web
    name: screening-ai-voicebot
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt && python generate_question_audio.py --mock
    startCommand: uvicorn app.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: PORT
        value: 8000
      - key: EXOTEL_ACCOUNT_SID
        sync: false
      - key: EXOTEL_API_KEY
        sync: false
      - key: EXOTEL_API_TOKEN
        sync: false
      - key: EXOTEL_SUBDOMAIN
        value: api.exotel.com
      - key: EXOTEL_EXOPHONE
        sync: false
      - key: EXOTEL_CALLER_NUMBER
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_STT_MODEL
        value: whisper-large-v3-turbo
      - key: GROQ_TTS_MODEL
        value: canopylabs/orpheus-v1-english
      - key: GROQ_TTS_VOICE
        value: hannah
      - key: PUBLIC_BASE_URL
        sync: false
      - key: MAX_SILENCE_SECONDS
        value: 3
      - key: MAX_ANSWER_SECONDS
        value: 45
      - key: TOTAL_CALL_TIMEOUT_SECONDS
        value: 480
